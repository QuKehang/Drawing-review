# ╔══════════════════════════════════════════════════════════════════╗
# ║  GPU 加速版本 — 需要 NVIDIA 显卡 + CUDA 11.8                     ║
# ║                                                                  ║
# ║  使用方法：                                                       ║
# ║    1. 将此文件覆盖 pyproject.toml                                  ║
# ║    2. uv sync                                                     ║
# ║    3. 安装 NVIDIA 运行库（见 README.md）                            ║
# ║                                                                  ║
# ║  切换至 CPU 版本：用 pyproject-cpu.toml 覆盖 pyproject.toml          ║
# ╚══════════════════════════════════════════════════════════════════╝

[project]
name = "drawing-review"
version = "0.1.0"
description = "图纸审查系统 — Drawing review system with OCR, BERT, YOLOv5, and RAG"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ── OCR ──────────────────────────────────
    "paddleocr>=2.9.0,<3.0.0",
    "paddlepaddle-gpu>=2.6.0,<3.0.0",
    "pytesseract>=0.3.0",
    # ── Deep Learning ────────────────────────
    "torch>=2.0.0",
    "transformers>=4.30.0",
    # ── Image Processing ─────────────────────
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    # ── GUI ──────────────────────────────────
    "PyQt5>=5.15.0,<5.15.10",
    "pyqt5-qt5==5.15.2",
    # ── Data ─────────────────────────────────
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # ── Misc ─────────────────────────────────
    "premailer>=3.10.0",
]

[project.optional-dependencies]
rag = [
    "langchain>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-classic>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=1.0.0",
    "chromadb>=0.5.0",
    "ollama>=0.6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "requests>=2.31.0",
]

[tool.uv]
# ── 注意 ─────────────────────────────────────
# albumentations → albucore 传递依赖 opencv-python-headless，
# 该包与 opencv-python 冲突，会导致 cv2.imshow / namedWindow
# 等 GUI 函数不可用。uv sync 后运行：
#   uv run python scripts/fix_opencv.py
#
# ── CUDA 运行库 ──────────────────────────────
# paddlepaddle-gpu 需要以下三个包（uv sync 后手动安装）：
#   uv pip install "nvidia-cuda-runtime-cu11>=11.8.0,<12.0.0"
#   uv pip install "nvidia-cudnn-cu11>=8.9.0,<9.0.0"
#   uv pip install "nvidia-cublas-cu11>=11.0.0,<12.0.0"
#  如果 PyPI 下载慢，可用清华镜像：
#   uv pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ nvidia-cuda-runtime-cu11 ...
# ────────────────────────────────────────────
